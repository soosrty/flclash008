name: build-ios

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS arm64 unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Restore build script permissions
        run: chmod +x plugins/setup/buildkit/*.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Run focused iOS tests
        run: flutter test test/providers/action_test.dart test/core/protocol_contract_test.dart --reporter expanded

      - name: Sync Go modules
        working-directory: core
        run: go mod tidy

      - name: Verify mihomo core
        working-directory: core/mihomo
        run: go test ./transport/vless ./common/utils ./adapter ./adapter/outbound

      - name: Build unsigned IPA
        run: dart setup.dart ios --no-codesign -v

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: FlClash-ios-arm64-unsigned
          path: dist/*.ipa
          if-no-files-found: error
          overwrite: true
          retention-days: 14
